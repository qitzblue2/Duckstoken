name: Build Windows exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      commit_exe:
        description: "Also commit Duckstoken.exe into the repository (main branch)"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -W ignore -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install -r requirements-dev.txt
          python -m PyInstaller --noconfirm --clean --onefile --console --name Duckstoken --add-data "duckstoken/web;duckstoken/web" duckstoken_launcher.py
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Duckstoken.exe -ArgumentList "--no-browser","--port","18999","--data-dir","$env:RUNNER_TEMP\duck" -PassThru
          Start-Sleep -Seconds 10
          $html = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18999/).Content
          if ($html -notmatch "Duckstoken") { throw "UI did not load" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Duckstoken-windows
          path: dist/Duckstoken.exe
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Duckstoken.exe
          generate_release_notes: true
      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest dist/Duckstoken.exe --prerelease --title "Latest build (main)" --notes "Automatic build of the main branch. Double-click Duckstoken.exe to run." --target $env:GITHUB_SHA
          exit 0
      - name: Commit Duckstoken.exe to main
        if: github.event_name == 'workflow_dispatch' && inputs.commit_exe && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Copy-Item dist\Duckstoken.exe Duckstoken.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Duckstoken.exe
          git commit -m "Build Duckstoken.exe from $env:GITHUB_SHA"
          git pull --rebase origin main
          git push origin HEAD:main
