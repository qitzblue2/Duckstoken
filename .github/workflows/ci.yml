name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -W ignore -m unittest discover -s tests -v
      - name: JS syntax check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: for f in duckstoken/web/*.js; do node --check "$f"; done
